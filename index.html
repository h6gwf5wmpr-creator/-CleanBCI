<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanBCI Advanced Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .dashboard-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #f1f5f9;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .result-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .result-detail {
            margin: 10px 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .result-detail span {
            font-weight: bold;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <h2>CleanBCI Advanced Dashboard</h2>
    <div class="subtitle">نظام تحليل إشارات الدماغ المتقدم - محاكاة الدماغ الواعي</div>
    
    <div style="margin-bottom: 15px;">
        <label>أدخل مصفوفة إشارات الدماغ (EEG Stream Array):</label>
        <textarea id="eegInput" placeholder="مثال: [3.5, -2.1, 8.4, 1.2, -4.5, 6.7]"></textarea>
    </div>
    
    <button class="btn-action" onclick="sendDataToAPI()">تحليل وفك تشويش الإشارات 🧠</button>
    
    <div id="loading" style="text-align:center; color:var(--primary); margin-top:15px; display:none; font-weight: bold;">جاري معالجة وفلترة الإشارات العصبية...</div>
    
    <div id="resultContainer" class="result-box">
        <div class="result-title">✨ تقرير الحالة العصبية المتقدم / Advanced Neural Report</div>
        <div class="result-detail" id="resLabel"></div>
        <div class="result-detail" id="resMean"></div>
        <div class="result-detail" id="resEnergy"></div>
        <div class="result-detail" id="resExplanation" style="color: #cbd5e1; background: #1e293b; padding: 10px; border-radius: 6px; margin-top: 10px;"></div>
    </div>
</div>

<script>
async function sendDataToAPI() {
    const inputVal = document.getElementById('eegInput').value;
    const resultContainer = document.getElementById('resultContainer');
    const loading = document.getElementById('loading');
    
    const resLabel = document.getElementById('resLabel');
    const resMean = document.getElementById('resMean');
    const resEnergy = document.getElementById('resEnergy');
    const resExplanation = document.getElementById('resExplanation');
    
    resultContainer.style.display = 'none';
    loading.style.display = 'block';
    
    try {
        let parsedData = JSON.parse(inputVal);
        const response = await fetch('https://cleanbci.onrender.com/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ features: parsedData })
        });
        const data = await response.json();
        
        resLabel.innerHTML = `<span>التصنيف العصبي:</span> ${data.label}`;
        resMean.innerHTML = `<span>متوسط الإشارة المنقية:</span> ${data.mean_signal_value}`;
        resEnergy.innerHTML = `<span>طاقة وقوة الإشارة الطيفية:</span> ${data.signal_energy}`;
        resExplanation.innerHTML = `<span>التحليل السريري والتقني:</span> ${data.description}`;
        
        resultContainer.style.display = 'block';
    } catch (error) {
        resultContainer.style.display = 'block';
        resLabel.innerHTML = `<span style="color:#ef4444;">خطأ في المدخلات:</span> تأكد من كتابة المصفوفة بشكل صحيح بالأقواس والأرقام الفاصلة.`;
        resMean.innerHTML = "";
        resEnergy.innerHTML = "";
        resExplanation.innerHTML = `التفاصيل التقنية: ${error}`;
    } finally {
        loading.style.display = 'none';
    }
}
</script>

</body>
</html>
