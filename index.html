<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanBCI Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .dashboard-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .btn-action:hover {
            opacity: 0.9;
        }
        .result-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #38bdf8;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <h2>CleanBCI Dashboard</h2>
    <div class="subtitle">نظام تحليل إشارات الدماغ الذكية</div>
    
    <div style="margin-bottom: 15px;">
        <label>مصفوفة القواطع والخصائص:</label>
        <textarea id="eegInput" placeholder="اكتب المصفوفة هنا، مثلاً: [-0.3, -1.2, 0.8]"></textarea>
    </div>
    
    <button class="btn-action" onclick="sendDataToAPI()">تحليل الإشارات الآن 🧠</button>
    
    <div id="loading" style="text-align:center; color:var(--primary); margin-top:10px; display:none;">جاري التحليل...</div>
    
    <div id="resultContainer" class="result-box">
        <strong>✨ النتيجة:</strong>
        <pre id="apiResult"></pre>
    </div>
</div>

<script>
async function sendDataToAPI() {
    const inputVal = document.getElementById('eegInput').value;
    const resultContainer = document.getElementById('resultContainer');
    const apiResult = document.getElementById('apiResult');
    const loading = document.getElementById('loading');
    
    resultContainer.style.display = 'none';
    loading.style.display = 'block';
    
    try {
        let parsedData = JSON.parse(inputVal);
        const response = await fetch('https://cleanbci.onrender.com/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ features: parsedData })
        });
        const data = await response.json();
        apiResult.textContent = JSON.stringify(data, null, 2);
        resultContainer.style.display = 'block';
    } catch (error) {
        apiResult.textContent = "خطأ: تأكد من صحة كتابة المصفوفة (مثال: [-0.3, -1.2, 0.8])\nالتفاصيل: " + error;
        resultContainer.style.display = 'block';
    } finally {
        loading.style.display = 'none';
    }
}
</script>

</body>
</html>
