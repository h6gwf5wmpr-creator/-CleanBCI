<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanBCI | منصة تحليل إشارات الدماغ الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #030712 0%, #0f172a 50%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #38bdf8;
            --secondary: #c084fc;
            --success: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-grad); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .dashboard { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 24px; padding: 40px; width: 100%; max-width: 650px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 28px; font-weight: 900; background: linear-gradient(90deg, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        textarea { width: 100%; height: 120px; padding: 16px; background: #020617; border: 2px solid #334155; border-radius: 14px; color: var(--primary); font-size: 15px; direction: ltr; text-align: left; outline: none; }
        .btn-action { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%); color: white; border: none; padding: 16px; font-size: 17px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 15px; }
        .result-box { margin-top: 25px; background: #020617; border: 1px solid #334155; padding: 20px; border-radius: 14px; display: none; }
        pre { color: var(--primary); direction: ltr; text-align: left; font-family: monospace; font-size: 14px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>CleanBCI Dashboard</h1>
            <p style="color:var(--text-muted);">نظام تحليل إشارات الدماغ الذكية</p>
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">مصفوفة القواطع والخصائص:</label>
            <textarea id="eegInput">[0.1, 0.5, 1.2, -0.4, 0.8]</textarea>
        </div>
        <button class="btn-action" onclick="sendDataToAPI()">تحليل الإشارات الآن 🧠</button>
        <div id="loading" style="text-align:center; color:var(--primary); margin-top:15px; display:none;">جاري المعالجة... ⏳</div>
        <div id="resultContainer" class="result-box">
            <strong>✨ النتيجة:</strong>
            <pre id="apiResult"></pre>
        </div>
    </div>
    <script>
        async function sendDataToAPI() {
            const inputVal = document.getElementById('eegInput').value;
            const resultContainer = document.getElementById('resultContainer');
            const apiResult = document.getElementById('apiResult');
            const loading = document.getElementById('loading');
            resultContainer.style.display = 'none';
            loading.style.display = 'block';
            try {
                let parsedData = JSON.parse(inputVal);
                const response = await fetch('https://cleanbci.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features: parsedData })
                });
                const data = await response.json();
                apiResult.textContent = JSON.stringify(data, null, 2);
                resultContainer.style.display = 'block';
            } catch (error) {
                apiResult.textContent = "خطأ: " + error;
                resultContainer.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
