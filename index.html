<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanBCI Advanced Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 flex flex-col items-center justify-center">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 shadow-2xl">
        <h1 class="text-2xl font-bold text-center text-cyan-400">CleanBCI Advanced Dashboard</h1>
        
        <div class="space-y-2" dir="ltr">
            <label class="block text-sm font-semibold text-slate-300 text-right" dir="rtl">أدخل مصفوفة إشارات الدماغ (EEG Stream Array):</label>
            <textarea id="eeg-input" class="w-full h-20 bg-slate-950 border border-slate-700 rounded-xl p-3 text-cyan-400 font-mono text-sm">[8.9, 6.3, 5.8, -9.1, 7.5, 6.2, -8.4]</textarea>
        </div>

        <button onclick="sendData()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition-all cursor-pointer">
            🧠 تحليل وفك تشويش الإشارات
        </button>

        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
            <h2 class="text-sm font-bold text-indigo-400">✨ تقرير الحالة العصبية</h2>
            <div>
                <span class="text-xs text-slate-500 block">التصنيف:</span>
                <span id="neuro-classification" class="text-base font-bold text-emerald-400">بانتظار التحليل...</span>
            </div>
            <div>
                <span class="text-xs text-slate-500 block">التحليل السريري:</span>
                <p id="analysis-desc" class="text-xs text-slate-300">اضغط على زر التحليل لعرض النتائج...</p>
            </div>
        </div>
    </div>

    <script>
        async function sendData() {
            let features;
            try {
                features = JSON.parse(document.getElementById('eeg-input').value);
            } catch (e) {
                alert('تأكد من صحة كتابة المصفوفة والأقواس!');
                return;
            }
            document.getElementById('neuro-classification').innerText = "جاري المعالجة...";
            try {
                const response = await fetch('https://cleanbci.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features: features })
                });
                const data = await response.json();
                if(response.ok) {
                    document.getElementById('neuro-classification').innerText = data.label;
                    document.getElementById('analysis-desc').innerText = data.description;
                } else {
                    document.getElementById('neuro-classification').innerText = "خطأ";
                    document.getElementById('analysis-desc').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('neuro-classification').innerText = "خطأ في الاتصال";
                document.getElementById('analysis-desc').innerText = "سيرفر Render قد يكون في حالة استيقاظ، انتظر لحظات وحاول مجدداً.";
            }
        }
    </script>
</body>
</html>
